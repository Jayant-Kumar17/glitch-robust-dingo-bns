# Paper-matching environment. Critical pins (also in pyproject.toml / requirements.txt):
#   numpy==1.26.4  scipy==1.13.1  torch==2.13.0  gwpy==4.0.1
#   dingo-gw @ git+https://github.com/dingo-gw/dingo.git@fede5c01524f3e205acf5750c0a0f101ff17e331
#
#   conda env create -f environment.yml
#   conda activate adapt_env
name: adapt_env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==1.26.4
      - scipy==1.13.1
      - torch==2.13.0
      - gwpy==4.0.1
      - "dingo-gw @ git+https://github.com/dingo-gw/dingo.git@fede5c01524f3e205acf5750c0a0f101ff17e331"
      - -r requirements.txt
      - -e .
