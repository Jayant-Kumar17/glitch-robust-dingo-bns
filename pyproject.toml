[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt"
version = "0.1.0"
description = "Glitch-aware front-end for frozen DINGO-BNS parameter estimation (matched-delta rebuild + analysis ASD)"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
